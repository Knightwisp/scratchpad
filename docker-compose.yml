# docker-compose.yml
version: '3.8'
services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__PuzzlerPiggyBank=Server=db;Database=PiggyBankDemo;User=sa;Password=PiggyBank2024!;TrustServerCertificate=true
      - AWS__SNS__WithdrawalEventsTopic=arn:aws:sns:us-east-1:123456789:demo-withdrawal-events
    command: dotnet run --project BankDemo.csproj
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=PiggyBank2024!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - ./setupDemo_piggyBankDB.sql:/docker-entrypoint-initdb.d/setupDemo_piggyBankDB.sql
      - db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P PiggyBank2024! -Q 'SELECT @@SERVERNAME AS ServerName;'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  db_data: